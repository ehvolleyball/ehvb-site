<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>EHVB | Home</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f4f5f7;
  color: #20232b;
  font-family: Arial, sans-serif;
}

main {
  max-width: 1200px;
  margin: auto;
  padding: 28px;
}


/* WELCOME BANNER */

.banner-header {
  width: 100%;
  margin-bottom: 42px;
}

.welcome-banner {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 12px;
  box-shadow: 0 8px 24px #0002;
}


/* MAIN CONTENT */

.hub {
  display: grid;
  grid-template-columns:
    minmax(0, 1.2fr)
    minmax(0, 1fr)
    minmax(0, .9fr);
  gap: 32px;
  align-items: start;
}


/* SECTION HEADINGS */

.section-title {
  margin: 0 0 18px;
  text-align: center;
  font-size: 26px;
  font-weight: 700;
}


/* GROUP SESSION */

.group-session {
  text-align: center;
}

.flyer {
  margin: 0;
}

.flyer-link {
  display: block;
  width: 100%;
  border-radius: 12px;
  text-decoration: none;
}

.flyer img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 12px;
  box-shadow: 0 8px 24px #0002;
  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

.flyer-link:hover img {
  transform: scale(1.02);
  box-shadow: 0 12px 28px #0003;
}

.flyer-link:focus-visible {
  outline: 3px solid #20232b;
  outline-offset: 5px;
}


/* REQUEST A SESSION */

.session {
  text-align: center;
}

.session-link {
  display: block;
  width: 100%;
  text-decoration: none;
  border-radius: 12px;
}

.session-image {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 12px;
  box-shadow: 0 8px 24px #0002;
  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

.session-link:hover .session-image {
  transform: scale(1.02);
  box-shadow: 0 12px 28px #0003;
}

.session-link:focus-visible {
  outline: 3px solid #20232b;
  outline-offset: 5px;
}


/* CURRENT SIGN UPS */

.current-signups {
  text-align: center;
  margin-top: 30px;
}

.current-signups .section-title {
  margin-bottom: 14px;
}

.signup-list-link {
  display: inline-block;
  position: relative;
  padding: 13px 25px;
  background: #d71920;
  color: white;
  border-radius: 30px;
  font-size: 16px;
  font-weight: bold;
  text-decoration: none;
  box-shadow: 0 4px 14px #0002;
  transition:
    transform 0.2s ease,
    background 0.2s ease,
    box-shadow 0.2s ease;
}

.signup-list-link:hover {
  background: #b9151b;
  transform: translateY(-2px);
  box-shadow: 0 7px 18px #0003;
}

.signup-list-link::after {
  content: "Check the List";
  position: absolute;
  left: 50%;
  bottom: -40px;
  transform: translateX(-50%);
  background: #20232b;
  color: white;
  padding: 7px 12px;
  border-radius: 6px;
  font-size: 13px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
  z-index: 10;
}

.signup-list-link:hover::after {
  opacity: 1;
}

.signup-list-link:focus-visible {
  outline: 3px solid #20232b;
  outline-offset: 5px;
}


/* SOCIAL MEDIA */

.socials {
  text-align: center;
}

.social-icons {
  display: flex;
  justify-content: center;
  gap: 22px;
  align-items: center;
  padding-top: 10px;
}

.social-icon {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  font-size: 13px;
  color: inherit;
  text-decoration: none;
}

.social-icon svg {
  width: 44px;
  height: 44px;
}

.social-icon:focus-visible {
  outline: 3px solid #20232b;
  outline-offset: 5px;
}

  /* TEXAS STATE VOLLEYBALL FEATURE */

.txstate-feature {
  max-width: 650px;
  width: 100%;
  margin: 55px auto 20px;
  text-align: center;
}

.txstate-flyer {
  position: relative;
  width: 100%;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 8px 24px #0002;
}

.txstate-flyer img {
  display: block;
  width: 100%;
  height: auto;
}

/* Invisible clickable area over GET YOUR TICKETS */

.ticket-hotspot {
  position: absolute;
  left: 21%;
  width: 61%;
  bottom: 4.5%;
  height: 7.5%;
  border-radius: 12px;
  cursor: pointer;
}

.ticket-hotspot:hover {
  background: rgba(255, 255, 255, 0.12);
}

.ticket-hotspot:focus-visible {
  outline: 4px solid white;
  outline-offset: -5px;
}

/* TABLET */

@media (max-width: 800px) {

  .hub {
    grid-template-columns: 1fr 1fr;
  }

  .group-session {
    grid-column: 1 / -1;
    max-width: 500px;
    width: 100%;
    justify-self: center;
  }

}


/* MOBILE */

@media (max-width: 500px) {

  main {
    padding: 18px;
  }

  .banner-header {
    margin-bottom: 28px;
  }

  .hub {
    grid-template-columns: 1fr;
  }

  .group-session {
    grid-column: auto;
  }

  .section-title {
    font-size: 24px;
  }

  .socials {
    padding-top: 10px;
  }

}

</style>
</head>
