<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>GG's | Group Session Registration</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f4f5f7;
  color: #20232b;
  font-family: Arial, sans-serif;
}

main {
  max-width: 1000px;
  margin: auto;
  padding: 28px;
}


/* TOP NAVIGATION */

.back-link {
  display: inline-block;
  margin-bottom: 24px;
  color: #d71920;
  font-size: 16px;
  font-weight: bold;
  text-decoration: none;
}

.back-link:hover {
  text-decoration: underline;
}


/* HEADER */

header {
  text-align: center;
  margin-bottom: 28px;
}

h1 {
  margin: 0 0 10px;
  font-size: clamp(30px, 5vw, 46px);
}

header p {
  margin: 0;
  font-size: 18px;
  color: #626975;
}


/* GOOGLE FORM */

.form-container {
  width: 100%;
  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 8px 24px #0002;
}

.form-container iframe {
  display: block;
  width: 100%;
  height: 1500px;
  border: 0;
}


/* MOBILE */

@media (max-width: 600px) {

  main {
    padding: 18px;
  }

  .form-container iframe {
    height: 1700px;
  }

}

</style>
</head>


<body>

<main>

  <a class="back-link" href="index.html">
    ← Back to GG's
  </a>


  <header>

    <h1>Group Session Registration</h1>

    <p>
      Register below for the upcoming EHVB group session.
    </p>

  </header>


  <div class="form-container">

    <iframe
      src="https://docs.google.com/forms/d/e/1FAIpQLSfNNlEiEfur4AICO-cCyVAABwWPWKb-xSvf_Q0ZdGldhCXPYg/viewform?embedded=true"
      title="GG's Group Session Registration"
      loading="lazy"
    >
      Loading…
    </iframe>

  </div>

</main>

</body>

</html>
